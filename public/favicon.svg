<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background Circle (Dark Mode Compatible) -->
  <style>
    .bg { fill: transparent; }
    .stroke-main { stroke: #2E7D32; fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fill-accent { fill: #2E7D32; }
    @media (prefers-color-scheme: dark) {
      .stroke-main { stroke: #4CAF50; }
      .fill-accent { fill: #81C784; }
    }
  </style>

  <!-- Thermomix Silhouette Base -->
  <path class="stroke-main" d="M 32 80 L 25 45 C 25 40, 30 35, 40 35 L 55 35 C 62 35, 65 40, 63 48 L 57 80 Z" />
  
  <!-- Bowl & Handle -->
  <path class="stroke-main" d="M 30 42 C 30 38, 35 30, 48 30 C 60 30, 63 38, 63 42" />
  <path class="stroke-main" d="M 25 48 C 18 50, 18 60, 26 65" />
  
  <!-- Screen/Dial UI -->
  <rect x="38" y="62" width="16" height="12" rx="2" class="stroke-main" />

  <!-- Fresh Botanical Leaves Accent -->
  <g class="fill-accent">
    <!-- Leaf 1 -->
    <path d="M 58 32 C 58 20, 72 18, 75 25 C 75 35, 62 38, 58 32 Z" />
    <!-- Leaf 2 -->
    <path d="M 68 32 C 75 25, 88 30, 85 40 C 78 45, 70 38, 68 32 Z" />
    <!-- Leaf 3 -->
    <path d="M 62 42 C 60 48, 72 55, 78 50 C 80 42, 70 38, 62 42 Z" />
    <!-- Stem -->
    <path d="M 56 38 Q 66 38 72 48" class="stroke-main" style="stroke-width: 2.5;" />
  </g>
</svg>
