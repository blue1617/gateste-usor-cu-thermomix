<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calculator comision</title>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1b1f1c; --muted:#5f6b63; --line:#dfe4df;
  --accent:#00a443; --accent-ink:#ffffff; --accent-soft:#e3f5ea; --danger:#c0392b;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121513; --card:#1b1f1c; --ink:#eef2ee; --muted:#9aa69e; --line:#2c332e;
    --accent:#1fc062; --accent-ink:#06210f; --accent-soft:#163323; --danger:#ff7a6b;
  }
}
:root[data-theme="dark"]{
  --bg:#121513; --card:#1b1f1c; --ink:#eef2ee; --muted:#9aa69e; --line:#2c332e;
  --accent:#1fc062; --accent-ink:#06210f; --accent-soft:#163323; --danger:#ff7a6b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}

/* Lock screen (same as /visual) */
.screen{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;width:100%;max-width:360px;text-align:center}
.lockbox h1{font-size:20px;margin:0 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lockbox input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
.err{color:var(--danger);font-size:13px;min-height:20px}

.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:focus-visible,.role:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Role question */
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:flex-end;padding:14px 16px}
.ask{width:100%;max-width:440px;text-align:center}
.ask h1{font-size:22px;margin:0 0 18px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:22px 12px;cursor:pointer;font-weight:700;font-size:18px}
.role:hover{border-color:var(--accent)}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.role small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.note{margin-top:18px;color:var(--muted);font-size:14px;min-height:22px}
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<section id="lock" class="screen">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <h1>Calculator comision</h1>
    <p>Introdu parola pentru a continua</p>
    <label for="pw" class="hidden">Parola</label>
    <input type="password" id="pw" placeholder="Parola" autofocus>
    <div class="err" id="pwErr" role="alert"></div>
    <button class="btn primary" style="width:100%">Intră</button>
  </form>
</section>

<!-- ============ ROLE QUESTION ============ -->
<div id="app" class="hidden">
  <header><button class="btn small" id="logoutBtn" type="button">Ieșire</button></header>
  <main class="screen">
    <section class="ask" aria-labelledby="askTitle">
      <h1 id="askTitle">Calculează comision pentru rol</h1>
      <div class="roles" role="group" aria-labelledby="askTitle">
        <button class="role" type="button" data-role="TL" aria-pressed="false">TL<small>Team Leader</small></button>
        <button class="role" type="button" data-role="Consultant" aria-pressed="false">Consultant<small>Vânzări personale</small></button>
      </div>
      <p class="note" id="roleNote" aria-live="polite"></p>
    </section>
  </main>
</div>

<script>
/* Same password and session as /visual */
const PW_HASH = "c9543f067ae40b94b9e0df2ca59e2108de0296393a41dceb7bdc48cfa0fb9bde"; // SHA-256 of the password
const PW_FALLBACK = "MTc5MWtyZXdyb1Y="; // reversed+base64, used only when the page is not on https
var store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
function $(s){return document.querySelector(s)}
async function sha256(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function checkPw(p){
  if(window.crypto&&crypto.subtle){return (await sha256(p))===PW_HASH}
  return btoa(p.split("").reverse().join(""))===PW_FALLBACK;
}
$("#lockForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(await checkPw($("#pw").value)){store.set("ok","1");unlock()}
  else{$("#pwErr").textContent="Parolă greșită";$("#pw").select()}
});
$("#logoutBtn").onclick=()=>{store.del("ok");location.reload()};
function unlock(){$("#lock").classList.add("hidden");$("#app").classList.remove("hidden")}

/* Role choice */
document.querySelectorAll(".role").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".role").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  $("#roleNote").textContent="Ai ales: "+b.dataset.role+". Calculatorul pentru acest rol urmează în curând.";
}));

if(store.get("ok")==="1") unlock();
</script>
</body>
</html>
